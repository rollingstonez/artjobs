# 아트잡스 가입 후 안내 메일(드립) — scripts/email/drip.ts
# - 매일 09:07 KST 자동 실행(GitHub cron 은 UTC: "7 0 * * *") + 수동 실행(workflow_dispatch).
# - 수동 실행에서 dry_run=true 를 고르면 보내지 않고 "누구에게 어떤 메일을" 만 로그에 찍는다.
# - 비밀값(GitHub Secrets): SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY (크롤러와 같은 것) + RESEND_API_KEY
name: email-drip
on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true 면 보내지 않고 대상만 출력"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
jobs:
  drip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4
      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: 패키지 설치
        run: npm ci
      - name: 안내 메일 보내기
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npx tsx scripts/email/drip.ts ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
