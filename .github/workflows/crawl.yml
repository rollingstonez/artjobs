# 아트잡스 공고 크롤러 — 바로쌤 crawl.yml 구조 이식
# - 지금은 수동 실행(workflow_dispatch)만. 수집 대상 기관이 확정되고 Supabase가 연결되면
#   schedule 주석을 풀어 자동화한다(GitHub cron은 UTC — KST 21:11 = "11 12 * * 1-5").
# - 비밀값: GitHub Secrets → 실행 시점에 .env.local 로 만들어 크롤러가 로컬과 동일하게 읽는다.
# - 각 단계 if: always() → 앞 소스가 실패해도 다음 소스는 계속 실행.
name: daily-crawl
on:
  # schedule:
  #   - cron: "11 12 * * 1-5"
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4
      - name: 파이썬 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 크롤러 패키지 설치
        run: pip install -r scripts/crawler/requirements.txt
      - name: .env.local 생성 (Secrets → 파일)
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          } > .env.local
      # 소스가 확정되면 아래 형태로 한 단계씩 추가한다.
      # - name: 한국문화예술위원회(ARKO) 크롤
      #   if: always()
      #   run: python scripts/crawler/crawl_arko.py
      - name: 준비 상태 확인
        run: python -c "import sys; sys.path.insert(0, 'scripts/crawler'); import common; print('크롤러 모듈 OK')"
