# 아트잡스 공고 크롤러 — 바로쌤 crawl.yml 구조 이식
# - 평일 21:11 KST 자동 실행(GitHub cron 은 UTC: "11 12 * * 1-5") + 수동 실행(workflow_dispatch).
# - 수동 실행에서 dry_run=true 를 고르면 DB 에 넣지 않고 수집 결과만 로그에 찍는다(파서 확인용).
# - 비밀값: GitHub Secrets → 실행 시점에 .env.local 로 만들어 크롤러가 로컬과 동일하게 읽는다.
# - 각 소스 단계 if: always() → 앞 소스가 실패해도 다음 소스는 계속 실행.
# - 소스는 운영자 화면(/admin/sources)에서 켠 것만 실제 수집한다(crawl_sources.is_active).
name: daily-crawl
on:
  schedule:
    - cron: "11 12 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true 면 DB 적재 없이 수집 결과만 출력"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      DRY: ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4
      - name: 파이썬 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 크롤러 패키지 설치
        run: pip install -r scripts/crawler/requirements.txt
      - name: .env.local 생성 (Secrets → 파일)
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          } > .env.local
      # ── 소스별 단계. 새 소스는 같은 모양으로 한 줄씩 추가 ──
      - name: 서울문화재단 채용 (sfac)
        if: always()
        run: python scripts/crawler/crawl_sfac.py $DRY
      - name: 서울문화재단 지원사업 공모 (sfac)
        if: always()
        run: python scripts/crawler/crawl_sfac_gongmo.py $DRY
      - name: 한국공예·디자인문화진흥원 (kcdf)
        if: always()
        run: python scripts/crawler/crawl_kcdf.py $DRY
      - name: 서울시립미술관 (sema)
        if: always()
        run: python scripts/crawler/crawl_sema.py $DRY
      - name: 국립현대미술관 (mmca)
        if: always()
        run: python scripts/crawler/crawl_mmca.py $DRY
      - name: 아트누리 (artnuri)
        if: always()
        run: python scripts/crawler/crawl_artnuri.py $DRY
      - name: 아트모아 (artmore)
        if: always()
        run: python scripts/crawler/crawl_artmore.py $DRY
      - name: 서울문화포털 (seoul_culture)
        if: always()
        run: python scripts/crawler/crawl_seoul_culture.py $DRY
