# 파서 만들 때 사이트 HTML 을 눈으로 확인하는 용도. 목록/상세 주소를 넣고 Run workflow → 로그에 정리된 HTML 이 찍힌다.
# 수집·적재는 하지 않는다. (작업 환경에서 외부 사이트 접근이 막혀 있어 GitHub 에서 대신 받아 본다)
name: fetch-sample
on:
  workflow_dispatch:
    inputs:
      url:
        description: "받아볼 페이지 주소 (목록 또는 상세)"
        required: true
        type: string
      max_lines:
        description: "출력 줄 수 상한"
        required: false
        default: "3000"
        type: string
      mode:
        description: "html(본문) / scripts(스크립트) / raw(원문) / text(텍스트) / grep(정규식) / json(AJAX JSON)"
        required: false
        default: "html"
        type: string
      post_data:
        description: "있으면 폼 POST (예: cbIdx=964&pageIndex=1)"
        required: false
        default: ""
        type: string
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/crawler/requirements.txt
      # 입력값은 env 로 넘긴다 — 정규식의 괄호·따옴표가 셸에서 깨지지 않게.
      - name: robots.txt
        env:
          URL: ${{ inputs.url }}
        run: |
          python - "$URL" <<'EOF'
          import sys, requests
          from urllib.parse import urlsplit
          for url in sys.argv[1].replace(",", " ").split():
              u = urlsplit(url); base = f"{u.scheme}://{u.netloc}"
              try:
                  r = requests.get(base + "/robots.txt", timeout=20)
                  print(f"=== robots.txt {base} HTTP {r.status_code}\n{r.text[:3000]}")
              except Exception as e:
                  print(f"=== robots.txt {base} 실패: {e}")
          EOF
      - name: 페이지 HTML
        env:
          URL: ${{ inputs.url }}
          MAX_LINES: ${{ inputs.max_lines }}
          MODE: ${{ inputs.mode }}
          POST_DATA: ${{ inputs.post_data }}
        run: python scripts/crawler/fetch_sample.py "$URL" "$MAX_LINES" "$MODE" "$POST_DATA"
